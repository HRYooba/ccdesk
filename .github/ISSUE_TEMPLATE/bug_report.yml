name: Bug report
description: Something is broken or behaves unexpectedly
labels: [fix]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch ccdesk
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `ccdesk doctor` and `ccdesk --version`, plus your terminal (e.g. Windows Terminal 1.22).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error log
      description: If ccdesk crashed or showed an error, paste the relevant part of `ccdesk logs`.
      render: text
