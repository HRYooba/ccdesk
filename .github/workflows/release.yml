name: Release

on:
  push:
    tags:
      # Matches version tags such as v0.1.0, v1.2.3, v1.2.3-rc.1
      - v[0-9]+.*

jobs:
  # Create the GitHub Release for the pushed tag (runs once, on Linux).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # タグの付け忘れ・version の上げ忘れをリリース作成前に止めるガード
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${ver} — bump Cargo.toml first"
            exit 1
          fi

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build the Windows binary and attach it (zip + sha256) to the release.
  upload-assets:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ccdesk
          target: x86_64-pc-windows-msvc
          # Produces ccdesk-<tag>-x86_64-pc-windows-msvc.zip
          archive: $bin-$tag-$target
          zip: all
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
