[package]
name = "ccdesk"
version = "0.7.0"
edition = "2024"
description = "A session manager TUI for Claude Code — see, switch, and drive all your sessions in one terminal"
license = "MIT"
repository = "https://github.com/HRYooba/ccdesk"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde_json = "1.0.151"
terminal-colorsaurus = "1.0.3"
tui-term = "0.3.4"
unicode-width = "0.2.2"
# セッション ID の採番。前景起動は `claude --session-id <uuid>` へ ccdesk が
# 採番した UUID を渡し、それがそのまま transcript の sessionId になる
uuid = { version = "1.24.0", features = ["v4"] }
vt100 = "0.16.2"
