[package]
name = "ccdesk"
version = "0.24.6"
edition = "2024"
description = "A session manager TUI for Claude Code — see, switch, and drive all your sessions in one terminal"
license = "MIT"
repository = "https://github.com/HRYooba/ccdesk"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde_json = "1.0.151"
terminal-colorsaurus = "1.0.3"
# OSC 4（ANSI パレット照会）を自前で投げるための端末ハンドル。
# terminal-colorsaurus が内部で使っているものと同じ層なので、fg/bg の照会と
# パレットの照会が同じ作法（raw mode の取り方・CONIN$/CONOUT$ の選び方）を通る
terminal-trx = "0.2.6"
tui-term = "0.3.4"
unicode-width = "0.2.2"
# セッション ID の採番。前景起動は `claude --session-id <uuid>` へ ccdesk が
# 採番した UUID を渡し、それがそのまま transcript の sessionId になる
uuid = { version = "1.24.0", features = ["v4"] }
vt100 = "0.16.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6.1"
